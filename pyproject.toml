[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "freightdesk"
version = "0.1.0"
description = "Evidence-backed logistics exception review with LangChain and LangGraph"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "langchain>=1,<2", "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4", "rank-bm25>=0.2,<1", "boto3>=1.35,<2"]
[project.optional-dependencies]
bedrock = ["langchain-aws>=1,<2"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "cfn-lint>=1,<2"]
[tool.hatch.build.targets.wheel]
packages = ["src/freightdesk"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
[tool.pytest.ini_options]
testpaths = ["tests"]
