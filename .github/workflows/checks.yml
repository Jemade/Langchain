name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,bedrock]'
      - run: ruff check .
      - run: ruff format --check src tests scripts
      - run: pytest -q
      - run: python scripts/evaluate.py
      - run: cfn-lint infra/learning-stack.yaml
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: runtime/workspace.png
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t freightdesk:test .
      - run: |
          docker run -d --name desk -e FREIGHTDESK_TOKEN=ci-container-reviewer-token -p 127.0.0.1:8000:8000 freightdesk:test
          for attempt in $(seq 1 20); do
            if curl --fail http://127.0.0.1:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs desk
          exit 1
